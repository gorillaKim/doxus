[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/plugin-sdk",
    "crates/plugins/obsidian",
    "crates/cli",
    "crates/mcp-server",
    "crates/agent",
    "crates/extism-poc",
    "apps/desktop/src-tauri",
    "crates/plugins/confluence",
    "crates/plugins/github",
]

[workspace.package]
version = "0.1.10"
edition = "2021"
authors = ["doxus contributors"]
license = "MIT"

[workspace.dependencies]
# async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
# error handling
thiserror = "2"
anyhow = "1"
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# database
rusqlite = { version = "0.32", features = ["bundled"] }
# http
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
# crypto / hashing
sha2 = "0.10"
hex = "0.4"
# vector search
sqlite-vec = "0.1.9"
zerocopy = { version = "0.7", features = ["derive"] }
# regex
regex = "1"
# testing
tokio-test = "0.4"
tempfile = "3"
wiremock = "0.6"
