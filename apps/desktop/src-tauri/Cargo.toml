[package]
name = "doxus-desktop"
version.workspace = true
edition = "2021"

[[bin]]
name = "doxus-desktop"
test = false

[lib]
name = "doxus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-oauth = "2"
tauri-plugin-updater = "2"
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
doxus-core = { path = "../../../crates/core" }
doxus-agent = { path = "../../../crates/agent" }
doxus-plugin-sdk = { path = "../../../crates/plugin-sdk" }
doxus-plugin-obsidian = { path = "../../../crates/plugins/obsidian" }
doxus-plugin-confluence = { path = "../../../crates/plugins/confluence" }
doxus-plugin-github = { path = "../../../crates/plugins/github" }
tokio = { workspace = true }
rusqlite = { workspace = true }
keyring = { version = "2", features = ["default"] }
sha2 = "0.10"
base64 = { version = "0.22", features = ["alloc"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
axum = "0.7"
tower-http = { version = "0.6", features = ["validate-request", "cors"] }
tracing = { workspace = true }
toml = "0.8"
sysinfo = "0.38.4"
once_cell = "1"
walkdir = "2.5.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = { workspace = true }
doxus-mcp = { path = "../../../crates/mcp-server" }
doxus-core = { path = "../../../crates/core", features = ["test-helpers"] }
doxus-plugin-obsidian = { path = "../../../crates/plugins/obsidian" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
mockito = "1"
hex = "0.4"
sha2 = "0.10"

[build-dependencies]
tauri-build = { version = "2", features = [] }
