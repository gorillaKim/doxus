[package]
name = "doxus-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "doxus-desktop"
test = false

[lib]
name = "doxus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-oauth = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
doxus-core = { path = "../../../crates/core" }
doxus-agent = { path = "../../../crates/agent" }
doxus-plugin-sdk = { path = "../../../crates/plugin-sdk" }
doxus-plugin-obsidian = { path = "../../../crates/plugins/obsidian" }
tokio = { workspace = true }
rusqlite = { workspace = true }
keyring = { version = "2", features = ["default"] }
sha2 = "0.10"
base64 = { version = "0.22", features = ["alloc"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
toml = "0.8"

[dev-dependencies]
tempfile = { workspace = true }
doxus-mcp = { path = "../../../crates/mcp-server" }
doxus-plugin-obsidian = { path = "../../../crates/plugins/obsidian" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
