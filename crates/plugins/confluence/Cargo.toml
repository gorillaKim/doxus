[package]
name = "confluence"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
doxus-plugin-sdk = { path = "../../plugin-sdk", default-features = false }
extism-pdk = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
base64 = "0.22"
htmd = "0.5"
quick-xml = { version = "0.37", features = ["serialize"] }
urlencoding = "2.1"
pulldown-cmark = "0.11"
anyhow = "1"
once_cell = "1"

# Native-only dependencies for testing and oauth helper
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
doxus-core = { path = "../../core" }
url = "2"
doxus-plugin-sdk = { path = "../../plugin-sdk", features = ["native"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
