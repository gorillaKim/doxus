[package]
name = "doxus-plugin-github"
version = "0.1.0"
edition = "2021"

[dependencies]
doxus-plugin-sdk = { path = "../../plugin-sdk" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"
tempfile = "3"
