[package]
name = "doxus-mcp"
version.workspace = true
edition.workspace = true

[[bin]]
name = "doxus-mcp"
path = "src/main.rs"

[dev-dependencies]
async-trait = { workspace = true }
tempfile = { workspace = true }
mockito = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full", "test-util"] }

[dependencies]
doxus-core = { path = "../core" }
doxus-plugin-sdk = { path = "../plugin-sdk" }
doxus-plugin-obsidian = { path = "../plugins/obsidian" }
doxus-plugin-confluence = { path = "../plugins/confluence" }
doxus-plugin-github = { path = "../plugins/github" }
rusqlite = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = "5"
rand = "0.8"
sha2 = "0.10"
keyring = { version = "2", features = ["default"] }
regex = { workspace = true }
