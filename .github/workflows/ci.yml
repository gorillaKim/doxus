name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Avoids needing onnxruntime pre-installed on runners
  ORT_STRATEGY: download
  DOXUS_SKIP_KEYCHAIN: "1"

jobs:
  test-rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Create dummy sidecar binaries for clippy
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          touch apps/desktop/src-tauri/binaries/doxus-mcp-aarch64-apple-darwin
          touch apps/desktop/src-tauri/binaries/doxus-mcp-x86_64-apple-darwin

      - name: Build WASM plugins for integration tests
        run: cargo build -p doxus-plugin-confluence --target wasm32-unknown-unknown

      - name: Format Check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-features

  # Catches Tauri macro expansion failures, build.rs errors, and missing IPC
  # command registration at PR time instead of waiting for a tag push.
  build-tauri-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Create dummy sidecar binaries for check
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          touch apps/desktop/src-tauri/binaries/doxus-mcp-aarch64-apple-darwin
          touch apps/desktop/src-tauri/binaries/doxus-mcp-x86_64-apple-darwin

      - name: cargo check (desktop lib + bin)
        run: cargo check -p doxus-desktop --all-targets

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Run Vitest
        run: npm test
        working-directory: apps/desktop
